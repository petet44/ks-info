<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="名優教育升學課程、香港住房配對及高才身分規劃服務。">
<title>服務資訊｜港優升學</title>
<style>


:root {
  --ink: #111528;
  --muted: #777b8d;
  --line: #ecebf3;
  --purple: #7652ec;
  --purple-deep: #5e3bd7;
  --canvas: #f5f4f8;
}

* { box-sizing: border-box; }
html { background: var(--canvas); }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(circle at 8% 4%, rgba(125, 84, 236, .12), transparent 24rem), #eeedf2;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
.app-shell { min-height: 100vh; padding: 0; }
.service-page {
  width: min(100%, 620px);
  min-height: 100vh;
  margin: 0 auto;
  background: #faf9fc;
  box-shadow: 0 0 0 1px rgba(22, 18, 42, .04), 0 30px 90px rgba(32, 24, 57, .08);
}
.topbar {
  height: 86px;
  padding: 18px 22px 14px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  background: rgba(250, 249, 252, .92);
  backdrop-filter: blur(20px);
}
.icon-button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  font-size: 36px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.menu-button { font-size: 17px; letter-spacing: 2px; background: #fff; border: 1px solid var(--line); }
.brand-lockup { text-align: center; }
.brand-lockup h1 { margin: 2px 0 0; font-size: 19px; letter-spacing: .04em; }
.brand-kicker { display: block; color: var(--purple); font-size: 10px; font-weight: 800; letter-spacing: .22em; }
.service-tabs {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 0 20px;
  background: rgba(250, 249, 252, .94);
  border-bottom: 1px solid rgba(224, 222, 234, .88);
  backdrop-filter: blur(18px);
}
.service-tabs button {
  position: relative;
  height: 54px;
  border: 0;
  background: transparent;
  color: #848392;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.service-tabs button::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -1px;
  width: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--purple);
  transform: translateX(-50%);
  transition: width .22s ease;
}
.service-tabs button.active { color: var(--ink); }
.service-tabs button.active::after { width: 34px; }
.course-section { padding-bottom: 56px; }
.editorial-intro {
  margin: 20px;
  padding: 26px 22px;
  min-height: 176px;
  border-radius: 28px;
  display: grid;
  grid-template-columns: 1fr 96px;
  gap: 18px;
  align-items: center;
  overflow: hidden;
  position: relative;
  background: radial-gradient(circle at 92% 15%, rgba(255,255,255,.95), transparent 28%), linear-gradient(135deg, #ebe5ff 0%, #f6f3ff 58%, #e7f0ff 100%);
  border: 1px solid rgba(118, 82, 236, .12);
}
.editorial-intro::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  right: -70px;
  bottom: -80px;
  border-radius: 50%;
  border: 22px solid rgba(118, 82, 236, .09);
}
.eyebrow { color: var(--purple-deep); font-size: 10px; font-weight: 900; letter-spacing: .14em; }
.editorial-intro h2 { margin: 8px 0; font-size: 24px; line-height: 1.25; letter-spacing: -.02em; }
.editorial-intro p { margin: 0; color: #66657a; font-size: 13px; line-height: 1.65; }
.brand-seal {
  width: 86px;
  height: 86px;
  border-radius: 30px;
  display: grid;
  place-content: center;
  text-align: center;
  transform: rotate(4deg);
  background: linear-gradient(150deg, #8263f0, #5f43cf);
  color: #fff;
  box-shadow: 0 16px 30px rgba(93, 61, 207, .23), inset 0 1px 0 rgba(255,255,255,.4);
}
.brand-seal span { font-size: 24px; font-weight: 900; letter-spacing: .08em; }
.brand-seal small { margin-top: 2px; font-size: 10px; letter-spacing: .28em; opacity: .76; }
.feed-heading { padding: 6px 22px 14px; display: flex; align-items: center; justify-content: space-between; }
.feed-heading div { display: flex; align-items: center; gap: 8px; }
.feed-heading strong { font-size: 18px; }
.feed-heading > span { color: #a09dad; font-size: 12px; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5c75; box-shadow: 0 0 0 5px rgba(255,92,117,.1); }
.course-feed { columns: 2; column-gap: 12px; padding: 0 16px; }
.post-card {
  display: inline-block;
  width: 100%;
  margin: 0 0 12px;
  overflow: hidden;
  break-inside: avoid;
  border-radius: 18px;
  background: #fff;
  border: 1px solid #efedf4;
  box-shadow: 0 5px 18px rgba(36, 28, 58, .045);
}
.post-open { width: 100%; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.post-open { display: block; color: inherit; text-decoration: none; }
.course-cover {
  position: relative;
  min-height: 206px;
  padding: 18px 16px 15px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: #fff;
}
.post-card:nth-child(3n + 2) .course-cover { min-height: 242px; }
.cover-violet { background: linear-gradient(155deg, #5c40bc 0%, #8a6cf2 58%, #c6b8ff 100%); }
.cover-blue { background: linear-gradient(155deg, #164f88 0%, #448fd1 60%, #a8ddf5 100%); }
.cover-peach { background: linear-gradient(155deg, #a83e52 0%, #e1766c 58%, #ffd3b5 100%); }
.cover-mint { background: linear-gradient(155deg, #17686b 0%, #4da69d 58%, #b9e2cf 100%); }
.cover-navy { background: linear-gradient(155deg, #111d42 0%, #2f467b 56%, #8ea4d2 100%); }
.cover-lilac { background: linear-gradient(155deg, #743885 0%, #aa6cb4 58%, #e6c2df 100%); }
.cover-topline, .cover-footer { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
.cover-topline { font-size: 8px; font-weight: 800; letter-spacing: .13em; opacity: .9; }
.cover-mark { padding: 4px 6px; border-radius: 7px; background: rgba(255,255,255,.18); letter-spacing: .1em; }
.course-cover strong { position: relative; z-index: 2; margin: auto 0; font-size: 25px; line-height: 1.2; letter-spacing: .03em; text-shadow: 0 2px 12px rgba(0,0,0,.12); }
.course-cover strong span { display: block; }
.cover-footer { font-size: 10px; letter-spacing: .08em; }
.cover-footer span:last-child { font-size: 18px; }
.poster-orbit { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); }
.poster-orbit-one { width: 180px; height: 180px; right: -70px; top: 22px; }
.poster-orbit-two { width: 102px; height: 102px; right: -28px; top: 62px; background: rgba(255,255,255,.08); }
.post-copy { padding: 13px 13px 4px; }
.post-copy h3 { margin: 0; font-size: 14px; line-height: 1.45; letter-spacing: -.01em; }
.post-copy p { margin: 7px 0 0; color: #777685; font-size: 11px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-meta { padding: 8px 12px 11px; display: flex; align-items: center; justify-content: space-between; color: #aaa7b4; font-size: 10px; }
.post-actions { display: flex; align-items: center; gap: 2px; }
.share-button { width: 30px; height: 30px; border: 0; background: transparent; color: #a4a1af; font-size: 18px; cursor: pointer; }
.save-button { width: 30px; height: 30px; border: 0; background: transparent; color: #a4a1af; font-size: 20px; cursor: pointer; }
.save-button.saved { color: var(--purple); }
.service-placeholder {
  margin: 22px 20px;
  padding: 62px 26px;
  border: 1px solid #ece9f3;
  border-radius: 28px;
  background: linear-gradient(150deg, #fff, #f2effa);
  text-align: center;
}
.service-placeholder span { color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: .18em; }
.service-placeholder h2 { margin: 14px 0 10px; font-size: 25px; }
.service-placeholder p { color: var(--muted); font-size: 14px; }
@media (min-width: 700px) {
  .app-shell { padding: 34px 0; }
  .service-page { min-height: calc(100vh - 68px); border-radius: 32px; overflow: clip; }
}
@media (max-width: 420px) {
  .topbar { padding-inline: 14px; }
  .editorial-intro { margin-inline: 14px; padding-inline: 18px; grid-template-columns: 1fr 76px; }
  .brand-seal { width: 72px; height: 72px; border-radius: 25px; }
  .editorial-intro h2 { font-size: 21px; }
  .course-feed { padding-inline: 10px; gap: 10px; }
  .course-cover { min-height: 188px; padding-inline: 13px; }
  .post-card:nth-child(3n + 2) .course-cover { min-height: 218px; }
  .course-cover strong { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }

/* Shared forms and actions */
.primary-action {
  min-height: 48px;
  padding: 0 22px;
  border: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, #8263f3, #6950e5);
  color: #fff;
  font-weight: 800;
  box-shadow: 0 10px 22px rgba(105, 80, 229, .2);
  cursor: pointer;
}
.primary-action:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
.secondary-action, .text-action { min-height: 44px; border: 0; background: transparent; color: var(--purple-deep); font-weight: 750; cursor: pointer; }
.secondary-action { padding: 0 18px; border: 1px solid #dcd4f6; border-radius: 14px; background: #fff; }
.field { display: grid; gap: 8px; margin: 0 0 17px; }
.field > span, .choice-field legend { color: #555566; font-size: 12px; font-weight: 750; }
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #e2dfe9;
  border-radius: 13px;
  outline: none;
  background: #fbfbfd;
  color: var(--ink);
  font-size: 14px;
}
.field textarea { resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #947cf0; box-shadow: 0 0 0 3px rgba(118, 82, 236, .1); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.contact-row { display: grid; grid-template-columns: 104px 1fr; gap: 8px; }
.check-row { display: grid; grid-template-columns: 20px 1fr; gap: 9px; align-items: start; color: #737080; font-size: 11px; line-height: 1.55; }
.check-row input { width: 17px; height: 17px; accent-color: var(--purple); }
.form-error { margin: 10px 0; color: #c13e54; font-size: 12px; }
.toast {
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  padding: 11px 16px;
  border: 0;
  border-radius: 999px;
  background: rgba(20, 20, 31, .9);
  color: #fff;
  font-size: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.2);
}

/* Consultation sheet */
.sheet-layer { position: fixed; inset: 0; z-index: 100; display: grid; align-items: end; justify-items: center; }
.sheet-backdrop { position: absolute; inset: 0; width: 100%; border: 0; background: rgba(20, 17, 34, .44); backdrop-filter: blur(4px); }
.consult-sheet { position: relative; width: min(100%, 620px); max-height: 88vh; overflow-y: auto; padding: 10px 22px 26px; border-radius: 28px 28px 0 0; background: #fff; box-shadow: 0 -22px 70px rgba(30, 22, 50, .2); }
.sheet-handle { width: 42px; height: 5px; margin: 0 auto 18px; border-radius: 99px; background: #ddd9e6; }
.sheet-title-row { display: flex; justify-content: space-between; align-items: start; margin-bottom: 14px; }
.sheet-title-row span { color: var(--purple); font-size: 10px; font-weight: 850; letter-spacing: .12em; }
.sheet-title-row h2 { margin: 4px 0 0; font-size: 24px; }
.close-button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #f2f0f6; color: #737080; font-size: 23px; cursor: pointer; }
.context-chip { margin-bottom: 18px; padding: 10px 12px; border-radius: 12px; background: #f4f1ff; color: #625587; font-size: 12px; line-height: 1.5; }
.consult-sheet .primary-action { width: 100%; margin-top: 18px; }
.consult-success { padding: 16px 0 6px; text-align: center; }
.success-mark { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: #ece7ff; color: var(--purple); font-size: 28px; font-weight: 900; }
.consult-success h2 { margin: 0 0 8px; }
.consult-success p { margin: 0 auto; max-width: 390px; color: var(--muted); font-size: 13px; line-height: 1.65; }

/* Housing */
.housing-section, .identity-section { padding: 20px 18px 66px; }
.housing-hero {
  min-height: 190px;
  padding: 26px 24px;
  display: grid;
  grid-template-columns: 1fr 132px;
  gap: 12px;
  align-items: center;
  border-radius: 28px;
  overflow: hidden;
  background: linear-gradient(138deg, #f0f7f1, #eaf5f4 58%, #edf0ff);
  border: 1px solid #dfeae5;
}
.housing-hero h2 { margin: 8px 0; max-width: 330px; font-size: 25px; line-height: 1.28; }
.housing-hero p { margin: 0; color: #65716f; font-size: 12px; line-height: 1.65; }
.home-illustration { position: relative; width: 120px; height: 120px; }
.home-roof { position: absolute; z-index: 2; left: 17px; top: 16px; width: 86px; height: 86px; border-radius: 14px 14px 24px 24px; background: #fff; transform: rotate(45deg); box-shadow: 0 18px 32px rgba(70, 113, 103, .16); }
.home-body { position: absolute; z-index: 3; left: 23px; top: 52px; width: 75px; height: 60px; border-radius: 12px 12px 20px 20px; background: #fff; }
.home-body i:first-child { position: absolute; left: 14px; top: 22px; width: 18px; height: 28px; border-radius: 8px 8px 2px 2px; background: #6aa79e; }
.home-body i:last-child { position: absolute; right: 13px; top: 17px; width: 20px; height: 18px; border-radius: 4px; background: #dbece8; box-shadow: inset 0 0 0 3px #8ebdb5; }
.home-key { position: absolute; z-index: 5; right: -2px; bottom: 8px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 18px; background: #f3b56e; color: #fff; font-size: 30px; transform: rotate(-18deg); box-shadow: 0 10px 20px rgba(180, 120, 60, .2); }
.service-steps { margin: 18px 2px; display: grid; grid-template-columns: auto 1fr auto 1fr auto; align-items: center; }
.service-steps div { display: grid; gap: 4px; justify-items: center; color: #5d5b68; font-size: 10px; }
.service-steps b { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: #4d8c83; border: 1px solid #d7e6e1; font-size: 10px; }
.service-steps i { height: 1px; background: #d9e3df; }
.housing-form { padding: 23px; border-radius: 25px; background: #fff; border: 1px solid #ebe9ef; box-shadow: 0 12px 36px rgba(35, 30, 46, .055); }
.form-head { margin-bottom: 22px; display: flex; justify-content: space-between; align-items: end; }
.form-head span { color: #7c66d8; font-size: 9px; font-weight: 900; letter-spacing: .14em; }
.form-head h3 { margin: 5px 0 0; font-size: 21px; }
.step-dots { display: flex; gap: 5px; }
.step-dots i { width: 18px; height: 4px; border-radius: 99px; background: #e9e6ee; }
.step-dots i.on { background: var(--purple); }
.choice-field { padding: 0; margin: 0 0 19px; border: 0; }
.choice-field legend { margin-bottom: 9px; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 13px; background: #f1eff4; }
.segmented button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: #85818d; font-weight: 750; cursor: pointer; }
.segmented button.selected { background: #fff; color: #292438; box-shadow: 0 4px 12px rgba(25, 20, 38, .08); }
.privacy-note { margin-bottom: 18px; padding: 16px; border-radius: 15px; background: #f4f8f6; border: 1px solid #e1ece7; }
.privacy-note strong { font-size: 14px; }
.privacy-note p { margin: 5px 0 0; color: #68736f; font-size: 11px; line-height: 1.6; }
.check-row.prominent { padding: 13px; border-radius: 13px; background: #faf9fc; border: 1px solid #ebe8f0; }
.form-actions { margin-top: 22px; display: flex; gap: 10px; justify-content: flex-end; }
.form-actions .primary-action { min-width: 150px; }
.housing-success { margin: 20px 18px; min-height: 530px; padding: 64px 28px; border-radius: 28px; background: linear-gradient(155deg, #fff, #edf7f3); border: 1px solid #e0ebe6; text-align: center; }
.success-home { width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 26px; background: #e0f0ea; color: #438d7b; font-size: 44px; }
.housing-success h2 { margin: 10px 0; font-size: 27px; }
.housing-success > p { margin: 0 auto; max-width: 430px; color: #68736f; font-size: 13px; line-height: 1.7; }
.reference-card { width: min(100%, 330px); margin: 26px auto 18px; padding: 15px 18px; display: flex; justify-content: space-between; border-radius: 14px; background: #fff; border: 1px solid #e2ebe7; font-size: 12px; }

/* Identity */
.identity-hero { position: relative; overflow: hidden; padding: 28px 26px; border-radius: 28px; background: #0d2040; color: #fff; border: 1px solid rgba(195, 162, 91, .46); box-shadow: 0 18px 38px rgba(13, 32, 64, .14); }
.identity-hero::after { content: ""; position: absolute; width: 190px; height: 190px; right: -90px; bottom: -120px; border-radius: 50%; border: 24px solid rgba(212, 172, 88, .12); }
.identity-kicker { display: inline-block; padding: 7px 11px; border: 1px solid rgba(215, 181, 110, .5); border-radius: 999px; color: #e9d19d; font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.identity-hero h2 { position: relative; z-index: 1; margin: 18px 0 8px; max-width: 470px; font-size: 27px; line-height: 1.3; }
.identity-hero p { position: relative; z-index: 1; margin: 0; max-width: 470px; color: #b7c2d3; font-size: 12px; line-height: 1.7; }
.identity-mode-tabs { margin: 18px 0 24px; padding: 4px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 15px; background: #ebeaf0; }
.identity-mode-tabs button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: #777486; font-weight: 780; cursor: pointer; }
.identity-mode-tabs button.active { background: #fff; color: #10223f; box-shadow: 0 5px 16px rgba(32, 30, 49, .08); }
.section-title { margin: 4px 2px 14px; display: flex; align-items: end; justify-content: space-between; }
.section-title span { color: #9d8450; font-family: Georgia, serif; font-size: 10px; font-weight: 750; letter-spacing: .14em; }
.section-title h3 { margin: 4px 0 0; font-size: 22px; color: #10223f; }
.time-pill { padding: 7px 9px; border-radius: 999px; background: #eef2f8; color: #76839a !important; font-family: inherit !important; letter-spacing: 0 !important; }
.quiz-card, .renew-card { padding: 22px; border-radius: 24px; background: #fff; border: 1px solid #e3e7ef; box-shadow: 0 8px 26px rgba(25, 38, 62, .05); }
.quiz-question { margin: 0; padding: 0 0 20px; border: 0; }
.quiz-question + .quiz-question { padding-top: 20px; border-top: 1px solid #edf0f4; }
.quiz-question legend { color: #14243e; font-size: 15px; font-weight: 800; line-height: 1.5; }
.quiz-question p { margin: 6px 0 12px; color: #7a8495; font-size: 11px; line-height: 1.55; }
.quiz-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.quiz-options button, .category-row button { min-height: 39px; padding: 0 17px; border: 1px solid #dfe4ed; border-radius: 11px; background: #f9fafc; color: #4a586e; font-weight: 740; cursor: pointer; }
.quiz-options button.selected, .category-row button.selected { border-color: #7e9ff7; background: #edf3ff; color: #2358c9; box-shadow: 0 0 0 2px rgba(71, 115, 225, .08); }
.quiz-result { margin-top: 2px; padding: 20px; border-radius: 18px; background: linear-gradient(145deg, #eef3ff, #f9f7ff); border: 1px solid #dfe5f4; }
.quiz-result > span { color: #73829b; font-size: 10px; font-weight: 750; letter-spacing: .1em; }
.quiz-result > strong { display: block; margin: 6px 0; color: #173c8f; font-size: 20px; }
.quiz-result > p { margin: 0; color: #61718b; font-size: 12px; line-height: 1.65; }
.result-actions { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
.result-actions .primary-action { min-height: 44px; }
.category-row { display: flex; gap: 9px; }
.renew-options { display: grid; gap: 9px; }
.renew-options button { padding: 13px 14px; display: grid; gap: 3px; text-align: left; border: 1px solid #e3e6ed; border-radius: 13px; background: #fafbfc; cursor: pointer; }
.renew-options button b { font-size: 13px; }
.renew-options button span { color: #7d8490; font-size: 10px; }
.renew-options button.selected { border-color: #9cb5f3; background: #f1f5ff; box-shadow: 0 0 0 2px rgba(71, 115, 225, .07); }
.renew-summary { margin-top: 20px; padding: 19px; border-radius: 17px; background: #0f2344; color: #fff; }
.renew-summary > span { color: #d8bb78; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
.renew-summary h4 { margin: 7px 0; font-size: 18px; }
.renew-summary p { margin: 0 0 16px; color: #b9c5d8; font-size: 11px; line-height: 1.65; }
.renew-summary .primary-action { background: #fff; color: #14274a; box-shadow: none; }
.guide-stack { margin-top: 26px; }
.section-title.compact { margin-bottom: 10px; }
.guide-stack details { margin-bottom: 8px; border: 1px solid #e2e6ed; border-radius: 15px; background: #fff; overflow: hidden; }
.guide-stack summary { padding: 16px 17px; display: flex; justify-content: space-between; list-style: none; color: #152744; font-size: 13px; font-weight: 780; cursor: pointer; }
.guide-stack summary::-webkit-details-marker { display: none; }
.guide-stack summary i { color: #a08040; font-size: 18px; font-style: normal; }
.guide-stack details p { margin: 0; padding: 0 17px 17px; color: #6e798a; font-size: 12px; line-height: 1.65; }
.official-note { margin-top: 22px; padding: 16px; display: grid; gap: 10px; border-radius: 15px; background: #f0f3f8; border: 1px solid #e0e5ec; }
.official-note strong { color: #34435b; font-size: 11px; }
.official-note p { margin: 4px 0 0; color: #778296; font-size: 10px; line-height: 1.55; }
.official-note a { color: #3a62bd; font-size: 11px; font-weight: 750; text-decoration: none; }

/* Course detail */
.detail-shell { padding-bottom: 0; }
.course-detail-page { padding-bottom: 92px; background: #f8f7fa; }
.detail-topbar { position: sticky; top: 0; z-index: 30; height: 66px; padding: 10px 18px; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; background: rgba(248, 247, 250, .9); backdrop-filter: blur(18px); text-align: center; font-size: 15px; font-weight: 800; }
.round-back, .round-share { width: 40px; height: 40px; border: 1px solid #e6e3ea; border-radius: 50%; background: #fff; cursor: pointer; }
.round-back { font-size: 31px; line-height: 1; }
.round-share { font-size: 18px; }
.detail-poster { margin: 0 18px; border-radius: 28px; overflow: hidden; box-shadow: 0 18px 38px rgba(31, 26, 49, .13); }
.course-cover.compact { min-height: 390px !important; padding: 28px; }
.course-cover.compact strong { font-size: 44px; }
.course-cover.compact .cover-topline { font-size: 11px; }
.course-cover.compact .cover-footer { font-size: 12px; }
.detail-content { padding: 22px 20px; }
.publisher-row { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; }
.publisher-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 15px; background: #7652ec; color: #fff; font-size: 12px; font-weight: 900; }
.publisher-row > div:nth-child(2) { display: grid; gap: 2px; }
.publisher-row strong { font-size: 13px; }
.publisher-row span { color: #92909c; font-size: 10px; }
.official-pill { padding: 6px 8px; border-radius: 99px; background: #efebff; color: #694fd5 !important; font-weight: 800; }
.detail-content > h1 { margin: 22px 0 10px; font-size: 27px; line-height: 1.32; letter-spacing: -.02em; }
.detail-lead { margin: 0; color: #6f6d7b; font-size: 14px; line-height: 1.7; }
.detail-actions-row { display: flex; gap: 8px; margin: 16px 0 24px; }
.detail-actions-row button { min-height: 38px; padding: 0 14px; border: 1px solid #e2dfe8; border-radius: 99px; background: #fff; color: #74717e; font-size: 11px; font-weight: 750; cursor: pointer; }
.detail-actions-row button.saved { border-color: #cabef4; background: #f3efff; color: var(--purple-deep); }
.course-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
.course-facts div { padding: 15px; border-radius: 16px; background: #fff; border: 1px solid #ece9f0; }
.course-facts span { display: block; margin-bottom: 5px; color: #9a96a5; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
.course-facts strong { font-size: 12px; line-height: 1.5; }
.detail-section { margin: 30px 0; }
.detail-eyebrow { color: var(--purple); font-size: 9px; font-weight: 900; letter-spacing: .14em; }
.detail-section h2 { margin: 6px 0 15px; font-size: 21px; }
.highlight-list { display: grid; gap: 8px; }
.highlight-list div { padding: 14px; display: flex; gap: 13px; align-items: center; border-radius: 14px; background: #fff; border: 1px solid #ece9f0; }
.highlight-list b { color: var(--purple); font-size: 10px; }
.highlight-list span { font-size: 13px; font-weight: 720; }
.post-body p { color: #5f5d6a; font-size: 14px; line-height: 1.85; }
.course-note { padding: 17px; border-radius: 16px; background: #f0edf8; }
.course-note strong { font-size: 12px; }
.course-note p { margin: 5px 0 0; color: #746e82; font-size: 10px; line-height: 1.6; }
.sticky-consult { position: fixed; z-index: 40; left: 50%; bottom: 0; width: min(100%, 620px); padding: 10px 18px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 48px 1fr; gap: 10px; background: rgba(255,255,255,.92); border-top: 1px solid #ece9ef; backdrop-filter: blur(18px); transform: translateX(-50%); }
.sticky-consult .primary-action { width: 100%; }
.detail-save { border: 1px solid #e2dfe8; border-radius: 14px; background: #fff; color: #918d9b; font-size: 20px; cursor: pointer; }
.detail-save.saved { color: var(--purple); background: #f3efff; }

@media (max-width: 420px) {
  .housing-section, .identity-section { padding-inline: 13px; }
  .housing-hero { grid-template-columns: 1fr 96px; padding-inline: 19px; }
  .housing-hero h2 { font-size: 21px; }
  .home-illustration { transform: scale(.78); transform-origin: right center; }
  .field-grid { grid-template-columns: 1fr; gap: 0; }
  .identity-hero h2 { font-size: 23px; }
  .quiz-card, .renew-card { padding: 18px; }
  .course-cover.compact { min-height: 330px !important; }
  .course-cover.compact strong { font-size: 37px; }
}

/* Static-export helpers */
[hidden]{display:none!important}
button:disabled{opacity:.45;cursor:not-allowed}
.static-note{margin:14px 20px;padding:10px 12px;border-radius:12px;background:#fff8e8;border:1px solid #f0dfb6;color:#766136;font-size:11px;line-height:1.55}
</style>
</head>
<body>
<div id="app"></div>
<script>
const courses = [{"id": "course-001", "title": "插班筆試衝刺班｜掌握香港校本題型", "excerpt": "中文、英文、數學三科重點拆解，針對目標學校安排練習。", "date": "8月22日", "updatedAt": "2026年8月22日", "theme": "violet", "kicker": "插班衝刺", "coverTitle": "筆試拆題\n快速進階", "note": "中小學適用", "audience": "準備香港中小學插班筆試的學生", "format": "小班教學／可配合一對一規劃", "highlights": ["三科能力定位", "校本題型訓練", "限時模擬與講評"], "paragraphs": ["插班筆試不只是把內地課程再溫習一次。不同學校對繁體中文、英文閱讀和英數題意的要求差異很大，準備時要先知道孩子真正卡在哪裡。", "課程先以短測找出能力差距，再按目標學校與準備時間安排中文、英文及數學訓練。每個階段都會保留模擬與講評，讓家長清楚看到孩子是否已能在限時環境下完成題目。"]}, {"id": "course-002", "title": "英文面試表達班｜從不敢說到有內容", "excerpt": "練習自我介紹、生活題與學校常見追問，建立自然表達。", "date": "8月20日", "updatedAt": "2026年8月20日", "theme": "blue", "kicker": "INTERVIEW", "coverTitle": "英文面試\n表達訓練", "note": "小班實戰", "audience": "需要準備英文或雙語入學面試的學生", "format": "互動小班／模擬面試", "highlights": ["自我介紹重組", "追問應對", "語音與眼神訓練"], "paragraphs": ["面試表達不是背一篇標準答案。真正的難點是聽懂追問、整理想法，再用適合自己程度的英文完整回答。", "課堂會以生活、學習和校園情境進行多輪練習，讓學生建立回答結構，同時保留自然度。導師會針對內容、語音、反應速度及非語言表現提供回饋。"]}, {"id": "course-003", "title": "繁體中文銜接課｜來港前先補好閱讀差距", "excerpt": "從字形辨認、閱讀速度到校本寫作，逐步適應香港課堂。", "date": "8月18日", "updatedAt": "2026年8月18日", "theme": "peach", "kicker": "中文銜接", "coverTitle": "看得懂\n寫得順", "note": "來港準備", "audience": "準備由內地轉入香港本地課程的學生", "format": "分級小班／線上及面授", "highlights": ["繁簡快速轉換", "閱讀速度訓練", "香港常見寫作要求"], "paragraphs": ["能看懂繁體字，不代表可以在考試時間內完成閱讀。很多學生來港初期的失分，來自閱讀速度、用詞差異和題目指令，而不是概念本身。", "課程由高頻字詞和題型開始，逐步連接閱讀理解與寫作。學習內容會配合學生年級，不以死背字表代替真正閱讀。"]}, {"id": "course-004", "title": "英數題意訓練｜不是不會算，是讀不懂題目", "excerpt": "熟悉英文數學指令、關鍵詞和長題閱讀，減少失分。", "date": "8月16日", "updatedAt": "2026年8月16日", "theme": "mint", "kicker": "MATHS IN ENGLISH", "coverTitle": "英數題意\n精準突破", "note": "能力提升", "audience": "數學概念穩定但英文題意理解較慢的學生", "format": "專題小班／能力分層", "highlights": ["指令詞拆解", "長題資訊整理", "英文解題表達"], "paragraphs": ["英文數學的難點常常不在運算，而在辨認條件、單位和問題真正要求。只背數學詞彙，仍不足以應付長題。", "課程把常見指令、題意結構與解題步驟放在一起訓練，幫助學生把語言理解轉成可執行的數學步驟。"]}, {"id": "course-005", "title": "DSE英文閱讀寫作｜建立中學長線能力", "excerpt": "按能力分層，兼顧校內成績與公開試題型。", "date": "8月12日", "updatedAt": "2026年8月12日", "theme": "navy", "kicker": "DSE ENGLISH", "coverTitle": "閱讀 × 寫作\n長線提升", "note": "中學生適用", "audience": "希望提早建立DSE英文能力的中學生", "format": "能力分層小班", "highlights": ["閱讀策略", "寫作框架", "校內與公開試銜接"], "paragraphs": ["英文能力需要長線累積，尤其閱讀速度、論述組織和字詞運用，難以在考前短期補回。", "課程以可持續的閱讀及寫作訓練為主，按學生目前程度調整材料，同時讓學習成果能反映在校內評估和公開試準備上。"]}, {"id": "course-006", "title": "一對一學習規劃｜先找差距，再安排課程", "excerpt": "根據年級、目標學校和準備時間，制定個人學習方案。", "date": "8月10日", "updatedAt": "2026年8月10日", "theme": "lilac", "kicker": "1 ON 1 PLAN", "coverTitle": "找到差距\n再開始補", "note": "專屬方案", "audience": "目標、時間或能力差距較複雜的家庭", "format": "一對一評估與規劃", "highlights": ["年級與能力定位", "目標拆解", "階段學習安排"], "paragraphs": ["不是所有學生都需要同一套課程。先確認目標學校、準備時間和目前差距，才能判斷應優先補哪一科、是否需要面試訓練，以及每個階段要達到什麼成果。", "顧問會把評測、選校和課程安排放在同一條時間線上，避免課程很多，但與實際申請節點無法配合。"]}];
const app = document.getElementById('app');
const state = { activeTab: sessionStorage.getItem('service-active-tab') || 'courses', housingStep: 1, housingType: 'family', identityMode:'apply', quiz:{}, renewCategory:'A', renewSituation:'employed', consult:null };

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function getFavorites(){try{return new Set(JSON.parse(localStorage.getItem('kongu-favorites')||'[]'))}catch{return new Set()}}
function saveFavorites(set){localStorage.setItem('kongu-favorites', JSON.stringify([...set]));}
function toggleFavorite(id){const s=getFavorites(); s.has(id)?s.delete(id):s.add(id); saveFavorites(s); render();}
function trackEvent(name,service,contextId){try{const a=JSON.parse(localStorage.getItem('kongu-events')||'[]');a.push({name,service,contextId,at:new Date().toISOString()});localStorage.setItem('kongu-events',JSON.stringify(a.slice(-100)));}catch{}}
function cover(post,compact=false){return `<div class="course-cover cover-${post.theme}${compact?' compact':''}" aria-hidden="true"><div class="poster-orbit poster-orbit-one"></div><div class="poster-orbit poster-orbit-two"></div><div class="cover-topline"><span>${esc(post.kicker)}</span><span class="cover-mark">名優</span></div><strong>${post.coverTitle.split('\n').map(x=>`<span>${esc(x)}</span>`).join('')}</strong><div class="cover-footer"><span>${esc(post.note)}</span><span>→</span></div></div>`;}
function baseHeader(){return `<header class="topbar"><button class="icon-button" aria-label="返回首頁" onclick="history.length>1?history.back():void 0">‹</button><div class="brand-lockup"><span class="brand-kicker">港優升學</span><h1>服務資訊</h1></div><button class="icon-button menu-button" aria-label="更多選項">•••</button></header><nav class="service-tabs" aria-label="服務分類">${[['courses','升學課程'],['housing','香港住房'],['identity','香港身分']].map(([id,label])=>`<button type="button" class="${state.activeTab===id?'active':''}" onclick="chooseTab('${id}')">${label}</button>`).join('')}</nav>`;}
function chooseTab(tab){sessionStorage.setItem('service-scroll-'+state.activeTab,String(scrollY)); state.activeTab=tab; sessionStorage.setItem('service-active-tab',tab); const u=new URL(location.href);u.searchParams.delete('course');u.searchParams.set('tab',tab);history.replaceState({},'',u);trackEvent('service_tab',tab);render();requestAnimationFrame(()=>scrollTo(0,Number(sessionStorage.getItem('service-scroll-'+tab)||0)));}
function courseFeed(){const fav=getFavorites(); return `<section class="course-section"><div class="editorial-intro"><div><span class="eyebrow">MING YAU EDUCATION</span><h2>找到真正適合孩子的課</h2><p>課程海報、教學重點和適合對象都整理在這裡。感興趣的內容可以先收藏，再向客服了解細節。</p></div><div class="brand-seal" aria-hidden="true"><span>名優</span><small>教育</small></div></div><div class="feed-heading"><div><span class="pulse-dot"></span><strong>最新課程</strong></div><span>持續更新</span></div><div class="course-feed">${courses.map(post=>`<article class="post-card"><a class="post-open" href="?course=${post.id}" onclick="trackEvent('post_detail','course','${post.id}')">${cover(post)}<div class="post-copy"><h3>${esc(post.title)}</h3><p>${esc(post.excerpt)}</p></div></a><div class="post-meta"><span>${esc(post.date)}</span><div class="post-actions"><button type="button" class="share-button" aria-label="分享課程" onclick="shareCourse('${post.id}');event.stopPropagation()">↗</button><button type="button" class="save-button ${fav.has(post.id)?'saved':''}" aria-label="收藏課程" onclick="toggleFavorite('${post.id}')">${fav.has(post.id)?'◆':'◇'}</button></div></div></article>`).join('')}</div></section>`;}
async function shareCourse(id){const p=courses.find(x=>x.id===id);const url=new URL(location.href);url.search='?course='+id;try{if(navigator.share)await navigator.share({title:p.title,text:'名優教育課程資訊',url:url.href});else if(navigator.clipboard)await navigator.clipboard.writeText(url.href);toast('分享連結已準備好')}catch{}}
function toast(text){let t=document.querySelector('.toast.static-toast');if(!t){t=document.createElement('button');t.className='toast static-toast';document.body.appendChild(t)}t.textContent=text;t.onclick=()=>t.remove();setTimeout(()=>t.remove(),2400);}

function housing(){return `<section class="housing-section"><div class="housing-hero"><div><span class="eyebrow">HONG KONG LIVING</span><h2>先了解你的生活，再開始找房</h2><p>名優客服先確認需求，再由指定合作方協助匹配。第一版不展示公開房源，也不在線收取租金。</p></div><div class="home-illustration" aria-hidden="true"><span class="home-roof"></span><span class="home-body"><i></i><i></i></span><span class="home-key">⌁</span></div></div><div class="service-steps" aria-label="住房服務流程"><div><b>01</b><span>提交需求</span></div><i></i><div><b>02</b><span>客服確認</span></div><i></i><div><b>03</b><span>合作方匹配</span></div></div><div id="housingArea"></div></section>`;}
function housingForm(){const s=state.housingStep; const data=JSON.parse(sessionStorage.getItem('housing-form')||'{}'); const v=(k,d='')=>esc(data[k]??d); return `<form class="housing-form" id="housingForm"><div class="form-head"><div><span>STEP ${s} / 3</span><h3>${s===1?'基本住房需要':s===2?'入住與通勤':'留下聯絡方式'}</h3></div><div class="step-dots"><i class="on"></i><i class="${s>=2?'on':''}"></i><i class="${s>=3?'on':''}"></i></div></div>${s===1?`<fieldset class="choice-field"><legend>住房類型</legend><div class="segmented"><button type="button" class="${state.housingType==='family'?'selected':''}" onclick="state.housingType='family';housingRefresh()">家庭長租</button><button type="button" class="${state.housingType==='student'?'selected':''}" onclick="state.housingType='student';housingRefresh()">學生住宿／合租</button></div></fieldset><label class="field"><span>目標地區</span><input name="area" value="${v('area')}" placeholder="例如：沙田、九龍塘，或仍未確定"></label><div class="field-grid"><label class="field"><span>每月預算（港幣）</span><input name="budget" inputmode="numeric" value="${v('budget')}" placeholder="例如：18,000"></label><label class="field"><span>預計入住日期</span><input name="moveInDate" type="date" value="${v('moveInDate')}"></label></div><div class="field-grid"><label class="field"><span>房型需要</span><select name="roomType"><option value="">請選擇</option>${['開放式','一房','兩房','三房或以上','單人宿位','合租房間'].map(x=>`<option ${data.roomType===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>預計租期</span><select name="leaseMonths">${[['6','約6個月'],['12','約12個月'],['24','兩年或以上'],['flexible','仍未確定']].map(([x,l])=>`<option value="${x}" ${(data.leaseMonths||'12')===x?'selected':''}>${l}</option>`).join('')}</select></label></div>`:s===2?`<label class="field"><span>入住人數</span><input name="occupants" value="${v('occupants')}" placeholder="${state.housingType==='family'?'例如：2位成人、1位小學生':'例如：1位中學生'}"></label>${state.housingType==='student'?`<label class="field"><span>學生情況</span><input name="studentDetails" value="${v('studentDetails')}" placeholder="年級、是否需要宿舍管理或監護安排"></label>`:''}<label class="field"><span>學校／通勤需要</span><input name="commute" value="${v('commute')}" placeholder="例如：30分鐘內到九龍塘，近港鐵"></label><label class="field"><span>家具需要</span><select name="furnished">${['需要家具','不需要家具','均可'].map(x=>`<option ${(data.furnished||'需要家具')===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>其他需要（選填）</span><textarea name="notes" placeholder="例如：可養寵物、需要電梯、希望安靜等" rows="4">${v('notes')}</textarea></label>`:`<div class="privacy-note"><strong>由名優客服先跟進</strong><p>靜態 HTML 版本不連接原本的雲端資料庫；提交內容只保存在此瀏覽器。</p></div><label class="field"><span>稱呼</span><input name="contactName" value="${v('contactName')}" placeholder="例如：陳女士"></label><label class="field"><span>聯絡方式</span><div class="contact-row"><select name="contactMethod">${['微信','電話','WhatsApp'].map(x=>`<option ${(data.contactMethod||'微信')===x?'selected':''}>${x}</option>`).join('')}</select><input name="contactValue" value="${v('contactValue')}" placeholder="填寫帳號或號碼"></div></label><label class="check-row prominent"><input type="checkbox" name="consent" ${data.consent?'checked':''}><span>我同意名優客服聯絡我，並同意在確認後把本次住房需求所需資料提供給指定合作方。</span></label>`}<div class="form-actions">${s>1?`<button type="button" class="text-action" onclick="housingSave();state.housingStep--;housingRefresh()">上一步</button>`:''}${s<3?`<button type="button" class="primary-action" onclick="housingNext()">下一步</button>`:`<button type="submit" class="primary-action">提交住房需求</button>`}</div></form>`;}
function housingSave(){const f=document.getElementById('housingForm');if(!f)return;const old=JSON.parse(sessionStorage.getItem('housing-form')||'{}');const fd=new FormData(f);for(const [k,v] of fd.entries())old[k]=v;old.consent=!!f.elements.consent?.checked;sessionStorage.setItem('housing-form',JSON.stringify(old));}
function housingNext(){housingSave();const d=JSON.parse(sessionStorage.getItem('housing-form')||'{}'); if(state.housingStep===1 && !(d.area&&d.budget&&d.moveInDate&&d.roomType))return toast('請先完成必填資料');if(state.housingStep===2 && !(d.occupants&&d.commute))return toast('請先完成必填資料');state.housingStep++;housingRefresh();}
function housingRefresh(){const a=document.getElementById('housingArea');if(a)a.innerHTML=housingForm();const f=document.getElementById('housingForm');if(f)f.onsubmit=(e)=>{e.preventDefault();housingSave();const d=JSON.parse(sessionStorage.getItem('housing-form')||'{}');if(!(d.contactName&&d.contactValue&&d.consent))return toast('請完成聯絡資料並勾選同意');const ref='HOU-LOCAL-'+Date.now().toString(36).toUpperCase();localStorage.setItem('kongu-last-housing',JSON.stringify({...d,requestType:state.housingType,reference:ref}));a.innerHTML=`<section class="housing-success"><div class="success-home"><span>⌂</span></div><span class="eyebrow">需求已保存在本機</span><h2>靜態版本已完成提交畫面</h2><p>此 HTML 沒有連接原本 Cloudflare/D1 後端，因此資料目前只保存在這個瀏覽器，不會真正傳送給客服。</p><div class="reference-card"><span>本機編號</span><strong>${ref}</strong></div><button class="secondary-action" type="button" onclick="sessionStorage.removeItem('housing-form');state.housingStep=1;housingRefresh()">再提交一個需求</button></section>`;};}

function choice(title,hint,key,options){const val=state.quiz[key];return `<fieldset class="quiz-question"><legend>${title}</legend>${hint?`<p>${hint}</p>`:''}<div class="quiz-options">${options.map(([v,l])=>`<button type="button" class="${val===v?'selected':''}" onclick="quizSet('${key}','${v}')">${l}</button>`).join('')}</div></fieldset>`;}
function quizSet(k,v){if(k==='income')state.quiz={income:v};else{state.quiz[k]=v;if(k==='eligibleDegree'){delete state.quiz.workThreeYears;delete state.quiz.hkLocalDegree}if(k==='workThreeYears')delete state.quiz.hkLocalDegree}identityRefresh();}
function quizResult(){const q=state.quiz;if(q.income==='yes')return 'A';if(q.income!=='no')return null;if(q.eligibleDegree==='no'||q.eligibleDegree==='unsure')return 'manual';if(q.eligibleDegree!=='yes')return null;if(q.workThreeYears==='yes')return 'B';if(q.workThreeYears!=='no')return null;if(q.hkLocalDegree==='yes'||q.hkLocalDegree==='unsure')return 'manual';if(q.hkLocalDegree==='no')return 'C';return null;}
const applyGuide=[['適用條件','A類看指定期間收入；B／C類主要涉及合資格大學學位、取得時間和工作經驗。'],['材料清單','按個人分支整理身分、旅行證件、學歷、工作或收入等證明；實際清單以官方要求為準。'],['申請流程','先確認類別與文件，再經官方電子渠道遞交；補件、審批及簽發安排由入境處決定。'],['常見風險','院校名單、收入性質、工作年資或學位取得方式判斷錯誤，均可能影響申請。']];
const renewGuide=[['申請時間','高才通續簽可於逗留期限屆滿前的官方指定窗口提出；不要等到最後才整理材料。'],['審核重點','一般需證明已在港受聘並有穩定收入，或已開設／參與在港業務；實際由入境處審批。'],['準備材料','僱員與經營業務人士的證明方向不同，應按自身情況準備僱傭、收入或營運資料。'],['常見風險','工作內容、收入、業務實質或文件互相不一致，可能增加補件及審批不確定性。']];
function guide(mode){const arr=mode==='apply'?applyGuide:renewGuide;return `<div class="guide-stack"><div class="section-title compact"><div><span>GUIDE</span><h3>${mode==='apply'?'首次申請指南':'續簽準備指南'}</h3></div></div>${arr.map(([t,x])=>`<details><summary><span>${t}</span><i>＋</i></summary><p>${x}</p></details>`).join('')}</div>`;}
function identity(){return `<section class="identity-section"><div class="identity-hero"><span class="identity-kicker">TTPS · 高才通規劃</span><h2>先看條件，再把申請與家庭時間線排清楚</h2><p>資格自測只作初步分流，不等於入境處確認或申請成功。正式遞交前仍需按最新政策和個人文件核實。</p></div><div class="identity-mode-tabs" role="tablist"><button type="button" class="${state.identityMode==='apply'?'active':''}" onclick="state.identityMode='apply';identityRefresh()">首次申請</button><button type="button" class="${state.identityMode==='renew'?'active':''}" onclick="state.identityMode='renew';identityRefresh()">續簽規劃</button></div><div id="identityArea"></div><div class="official-note"><div><strong>資料查核：2026年8月</strong><p>政策、名單、費用及處理安排可能更新，應以香港入境事務處最新公布為準。</p></div><a href="https://www.immd.gov.hk/hkt/services/visas/TTPS.html" target="_blank" rel="noreferrer">查看官方來源 ↗</a></div></section>`;}
function identityInner(){if(state.identityMode==='renew'){const summary=state.renewSituation==='employed'?'證明在港工作與穩定收入':state.renewSituation==='business'?'整理業務實際營運證據':'先判斷現況是否具備續簽基礎';return `<div class="identity-content"><div class="section-title"><div><span>RENEWAL PLANNING</span><h3>續簽情況快速整理</h3></div><span class="time-pill">先排重點</span></div><div class="renew-card"><fieldset class="choice-field"><legend>目前高才通類別</legend><div class="category-row">${['A','B','C'].map(c=>`<button type="button" class="${state.renewCategory===c?'selected':''}" onclick="state.renewCategory='${c}';identityRefresh()">${c}類</button>`).join('')}</div></fieldset><fieldset class="choice-field"><legend>目前主要情況</legend><div class="renew-options">${[['employed','已在港受聘','準備僱傭、職位及收入證明'],['business','已開設／參與業務','準備業務營運及貢獻資料'],['other','其他／仍在準備','先評估時間窗口與材料缺口']].map(([v,b,s])=>`<button type="button" class="${state.renewSituation===v?'selected':''}" onclick="state.renewSituation='${v}';identityRefresh()"><b>${b}</b><span>${s}</span></button>`).join('')}</div></fieldset><div class="renew-summary"><span>你的規劃重點</span><h4>${summary}</h4><p>高才通${state.renewCategory}類的首次逗留安排與續簽準備節點可能不同；入境處會按申請時的實際情況審批。</p><button type="button" class="primary-action" onclick="openConsult('identity','高才通${state.renewCategory}類續簽規劃')">預約續簽規劃顧問</button></div></div>${guide('renew')}</div>`;}
const r=quizResult();let result='';if(r){const title=r==='manual'?'建議人工評估':`可能對應高才通 ${r} 類`;const desc={A:'收入條件可能對應A類；仍需核實收入性質、期間及證明文件。',B:'學歷與工作年資可能對應B類；仍需核實學位、院校名單與工作經驗。',C:'學歷與年資可能對應C類；C類受年度配額及其他官方條件限制。',manual:'目前資料不足以直接分流，或可能不符合A／B／C的基本組合，建議先核實學歷、收入和個人情況。'}[r];result=`<div class="quiz-result result-${r}"><span>初步自測結果</span><strong>${title}</strong><p>${desc}</p><div class="result-actions"><button type="button" class="primary-action" onclick="openConsult('identity','高才通首次申請｜初步結果 ${r==='manual'?'需人工評估':r+'類'}')">預約顧問核實</button><button type="button" class="text-action" onclick="state.quiz={};identityRefresh()">重新自測</button></div></div>`;}
return `<div class="identity-content"><div class="section-title"><div><span>QUALIFICATION CHECK</span><h3>高才通資格初步自測</h3></div><span class="time-pill">約1分鐘</span></div><div class="quiz-card">${choice('緊接申請前一年，全年收入是否達港幣250萬元或以上？','以符合官方定義的就業或業務收入為準，個人投資收入不計入。','income',[['yes','是'],['no','否／不確定']])}${state.quiz.income==='no'?choice('你是否在緊接申請前五年內，獲合資格大學頒授學士學位？','合資格大學名單會更新；不確定時選擇「需要核實」。','eligibleDegree',[['yes','是'],['no','否'],['unsure','需要核實']]):''}${state.quiz.income==='no'&&state.quiz.eligibleDegree==='yes'?choice('緊接申請前五年內，是否累積至少三年工作經驗？','','workThreeYears',[['yes','是'],['no','不足三年']]):''}${state.quiz.workThreeYears==='no'?choice('該學位是否在香港修讀全日制經本地評審課程取得？','','hkLocalDegree',[['yes','是'],['no','否'],['unsure','不確定']]):''}${result}</div>${guide('apply')}</div>`;}
function identityRefresh(){const a=document.getElementById('identityArea');if(a)a.innerHTML=identityInner();}

function openConsult(service,title){state.consult={service,title};document.body.insertAdjacentHTML('beforeend',`<div class="sheet-layer" id="consultLayer" role="dialog" aria-modal="true"><button type="button" class="sheet-backdrop" onclick="closeConsult()"></button><section class="consult-sheet"><div class="sheet-handle"></div><form id="consultForm"><div class="sheet-title-row"><div><span>1對1客服</span><h2>預約諮詢</h2></div><button type="button" class="close-button" onclick="closeConsult()">×</button></div><div class="context-chip">正在諮詢：${esc(title)}</div><label class="field"><span>稱呼</span><input name="name" placeholder="例如：陳女士" required></label><label class="field"><span>聯絡方式</span><div class="contact-row"><select name="method"><option>微信</option><option>電話</option><option>WhatsApp</option></select><input name="contact" placeholder="填寫帳號或號碼" required></div></label><label class="check-row"><input type="checkbox" name="consent"><span>我同意客服使用以上資料聯絡我，並已閱讀私隱提示。</span></label><div class="static-note">靜態 HTML 版本不連接原本資料庫；提交後只會保存在這個瀏覽器。</div><button type="submit" class="primary-action">提交諮詢</button></form></section></div>`);document.getElementById('consultForm').onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.consent.checked)return toast('請先勾選同意');const fd=Object.fromEntries(new FormData(f));localStorage.setItem('kongu-last-inquiry',JSON.stringify({...fd,service,title,at:new Date().toISOString()}));f.parentElement.innerHTML=`<div class="consult-success"><span class="success-mark">✓</span><h2>已保存在本機</h2><p>這是靜態 HTML 版本，因此資料沒有傳送至原本客服後端。</p><button type="button" class="primary-action" onclick="closeConsult()">完成</button></div>`;};}
function closeConsult(){document.getElementById('consultLayer')?.remove();state.consult=null;}

function courseDetail(id){const p=courses.find(x=>x.id===id);if(!p)return `<main class="app-shell"><div class="service-page"><div style="padding:40px">找不到課程。<a href="?tab=courses">返回</a></div></div></main>`;const saved=getFavorites().has(id);return `<main class="app-shell detail-shell"><article class="service-page course-detail-page"><header class="detail-topbar"><button type="button" class="round-back" onclick="location.href='?tab=courses'">‹</button><span>課程詳情</span><button type="button" class="round-share" onclick="shareCourse('${id}')">↗</button></header><div class="detail-poster">${cover(p,true)}</div><div class="detail-content"><div class="publisher-row"><div class="publisher-mark">名優</div><div><strong>名優教育</strong><span>更新於 ${esc(p.updatedAt)}</span></div><span class="official-pill">官方課程</span></div><h1>${esc(p.title)}</h1><p class="detail-lead">${esc(p.excerpt)}</p><div class="detail-actions-row"><button type="button" onclick="toggleFavorite('${id}')" class="${saved?'saved':''}">${saved?'◆ 已收藏':'◇ 收藏'}</button><button type="button" onclick="shareCourse('${id}')">↗ 分享</button></div><section class="course-facts"><div><span>適合對象</span><strong>${esc(p.audience)}</strong></div><div><span>課程形式</span><strong>${esc(p.format)}</strong></div></section><section class="detail-section"><span class="detail-eyebrow">WHAT YOU WILL LEARN</span><h2>課程重點</h2><div class="highlight-list">${p.highlights.map((x,i)=>`<div><b>0${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div></section><section class="detail-section post-body"><span class="detail-eyebrow">ABOUT THE COURSE</span><h2>課程介紹</h2>${p.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')}</section><div class="course-note"><strong>課程安排以客服確認為準</strong><p>班期、上課地點、收費和餘額可能調整。提交諮詢後，客服會帶上本課程名稱與編號跟進。</p></div></div><div class="sticky-consult"><button type="button" class="detail-save ${saved?'saved':''}" onclick="toggleFavorite('${id}')">${saved?'◆':'◇'}</button><button type="button" class="primary-action" onclick="openConsult('course',${JSON.stringify(p.title+'（'+p.id+'）')})">諮詢課程細節</button></div></article></main>`;}

function render(){const params=new URLSearchParams(location.search);const course=params.get('course');if(course){app.innerHTML=courseDetail(course);return}const tab=params.get('tab');if(['courses','housing','identity'].includes(tab))state.activeTab=tab;app.innerHTML=`<main class="app-shell"><div class="service-page">${baseHeader()}${state.activeTab==='courses'?courseFeed():state.activeTab==='housing'?housing():identity()}</div></main>`;if(state.activeTab==='housing')housingRefresh();if(state.activeTab==='identity')identityRefresh();}
addEventListener('popstate',render);render();
</script>
</body>
</html>
